<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-label="資料條件與選圖決策矩陣">
  <title>資料條件與選圖決策矩陣</title>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; fill: #64748B; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .cat-en { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 11px; text-anchor: middle; opacity: 0.85; }
      .branch-text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; fill: #334155; font-weight: 500; }
      .chart-name { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .chart-en { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #64748B; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      .branch-line { fill: none; stroke-width: 1.5; stroke-linecap: round; }
      .node-dot { stroke-width: 2; fill: #FFFFFF; }
      .badge-rec { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: 700; fill: #15803D; }
    </style>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect x="2" y="2" width="1156" height="736" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部標題區 -->
  <g transform="translate(36, 42)">
    <rect x="-8" y="-18" width="4" height="26" rx="2" fill="#2563EB" />
    <text x="6" y="2" class="title">資料特徵與選圖決策矩陣</text>
    <text x="6" y="24" class="subtitle">先辨識核心問題類型，再依「類別數量、時間點多寡、變數維度」等資料特徵挑選最佳圖表</text>
  </g>

  <!-- 欄位標題列 -->
  <g transform="translate(36, 102)">
    <rect x="0" y="0" width="1088" height="32" rx="6" fill="#F8FAFC" stroke="#EDF2F7" stroke-width="1" />
    <text x="24" y="21" class="col-header">1. 分析目的（問題類型）</text>
    <text x="220" y="21" class="col-header">2. 資料特徵與條件分支</text>
    <text x="640" y="21" class="col-header">3. 推薦最佳圖表</text>
    <text x="960" y="21" class="col-header">決策關鍵提示</text>
  </g>

  <!-- ========================================== -->
  <!-- 1. 比較 (Comparison) -->
  <!-- ========================================== -->
  <g transform="translate(36, 148)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="1088" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- 類別徽章 -->
    <rect x="18" y="24" width="130" height="64" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="83" y="52" class="cat-title" fill="#1E40AF">比較</text>
    <text x="83" y="70" class="cat-en" fill="#3B82F6">Comparison</text>

    <!-- 樹狀分支連線 -->
    <path d="M 148 56 C 175 56, 185 18, 210 18" class="branch-line" stroke="#93C5FD" />
    <path d="M 148 56 C 175 56, 185 43, 210 43" class="branch-line" stroke="#93C5FD" />
    <path d="M 148 56 C 175 56, 185 69, 210 69" class="branch-line" stroke="#93C5FD" />
    <path d="M 148 56 C 175 56, 185 94, 210 94" class="branch-line" stroke="#93C5FD" />

    <!-- 分支 1 -->
    <circle cx="210" cy="18" r="3.5" class="node-dot" stroke="#2563EB" />
    <text x="224" y="22" class="branch-text">類別 ≤ 7 個、標籤文字短</text>
    <line x1="430" y1="18" x2="620" y2="18" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="22" class="chart-name">垂直長條圖</text><text x="735" y="22" class="chart-en">Column Chart</text>
    <text x="960" y="22" font-size="12" fill="#15803D" font-weight="600">Y 軸必須從 0 起跳</text>

    <!-- 分支 2 -->
    <circle cx="210" cy="43" r="3.5" class="node-dot" stroke="#2563EB" />
    <text x="224" y="47" class="branch-text">類別 &gt; 7 個、或標籤文字較長</text>
    <line x1="430" y1="43" x2="620" y2="43" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="47" class="chart-name">水平長條圖</text><text x="735" y="47" class="chart-en">Bar Chart</text>
    <text x="960" y="47" font-size="12" fill="#64748B">依數值由大到小排序</text>

    <!-- 分支 3 -->
    <circle cx="210" cy="69" r="3.5" class="node-dot" stroke="#2563EB" />
    <text x="224" y="73" class="branch-text">跨兩個指標或時間點比較</text>
    <line x1="430" y1="69" x2="620" y2="69" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="73" class="chart-name">分組長條圖</text><text x="735" y="73" class="chart-en">Grouped Bar</text>
    <text x="960" y="73" font-size="12" fill="#64748B">群組間距 &gt; 柱狀間距</text>

    <!-- 分支 4 -->
    <circle cx="210" cy="94" r="3.5" class="node-dot" stroke="#2563EB" />
    <text x="224" y="98" class="branch-text">項目繁多且需突顯數值精確點</text>
    <line x1="430" y1="94" x2="620" y2="94" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="98" class="chart-name">點圖 / 棒棒糖圖</text><text x="765" y="98" class="chart-en">Dot / Lollipop</text>
    <text x="960" y="98" font-size="12" fill="#64748B">大幅減輕視覺負擔</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. 組成 (Composition) -->
  <!-- ========================================== -->
  <g transform="translate(36, 272)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="1088" height="92" rx="10" fill="#FDFCFB" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- 類別徽章 -->
    <rect x="18" y="16" width="130" height="60" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2" />
    <text x="83" y="42" class="cat-title" fill="#C2410C">組成</text>
    <text x="83" y="60" class="cat-en" fill="#EA580C">Composition</text>

    <!-- 樹狀分支連線 -->
    <path d="M 148 46 C 175 46, 185 20, 210 20" class="branch-line" stroke="#FDBA74" />
    <path d="M 148 46 C 175 46, 185 46, 210 46" class="branch-line" stroke="#FDBA74" />
    <path d="M 148 46 C 175 46, 185 72, 210 72" class="branch-line" stroke="#FDBA74" />

    <!-- 分支 1 -->
    <circle cx="210" cy="20" r="3.5" class="node-dot" stroke="#EA580C" />
    <text x="224" y="24" class="branch-text">類別極少（≤ 4 個）且強調比例</text>
    <line x1="430" y1="20" x2="620" y2="20" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="24" class="chart-name">圓餅圖 / 甜甜圈圖</text><text x="785" y="24" class="chart-en">Pie / Donut</text>
    <text x="960" y="24" font-size="12" fill="#DC2626" font-weight="600">勿切超過 5 塊披薩</text>

    <!-- 分支 2 -->
    <circle cx="210" cy="46" r="3.5" class="node-dot" stroke="#EA580C" />
    <text x="224" y="50" class="branch-text">類別 &gt; 4 個、或需看精準占比</text>
    <line x1="430" y1="46" x2="620" y2="46" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="50" class="chart-name">百分比長條圖</text><text x="750" y="50" class="chart-en">100% Stacked Bar</text>
    <text x="960" y="50" font-size="12" fill="#15803D" font-weight="600">首選！易讀性最高</text>

    <!-- 分支 3 -->
    <circle cx="210" cy="72" r="3.5" class="node-dot" stroke="#EA580C" />
    <text x="224" y="76" class="branch-text">同時看各部分絕對值與整體總額</text>
    <line x1="430" y1="72" x2="620" y2="72" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="76" class="chart-name">堆疊長條圖</text><text x="735" y="76" class="chart-en">Stacked Bar</text>
    <text x="960" y="76" font-size="12" fill="#64748B">務必註明總額與單位</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. 分布 (Distribution) -->
  <!-- ========================================== -->
  <g transform="translate(36, 376)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="1088" height="74" rx="10" fill="#FAF5FF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- 類別徽章 -->
    <rect x="18" y="12" width="130" height="50" rx="10" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.2" />
    <text x="83" y="34" class="cat-title" fill="#7E22CE">分布</text>
    <text x="83" y="50" class="cat-en" fill="#9333EA">Distribution</text>

    <!-- 樹狀分支連線 -->
    <path d="M 148 37 C 175 37, 185 22, 210 22" class="branch-line" stroke="#C084FC" />
    <path d="M 148 37 C 175 37, 185 52, 210 52" class="branch-line" stroke="#C084FC" />

    <!-- 分支 1 -->
    <circle cx="210" cy="22" r="3.5" class="node-dot" stroke="#7E22CE" />
    <text x="224" y="26" class="branch-text">單一連續數值、觀察集中波峰</text>
    <line x1="430" y1="22" x2="620" y2="22" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="26" class="chart-name">直方圖</text><text x="700" y="26" class="chart-en">Histogram</text>
    <text x="960" y="26" font-size="12" fill="#64748B">柱子相連、表示連續區間</text>

    <!-- 分支 2 -->
    <circle cx="210" cy="52" r="3.5" class="node-dot" stroke="#7E22CE" />
    <text x="224" y="56" class="branch-text">突顯中位數、四分位距與極端離群值</text>
    <line x1="430" y1="52" x2="620" y2="52" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="56" class="chart-name">箱形圖（盒鬚圖）</text><text x="770" y="56" class="chart-en">Box Plot</text>
    <text x="960" y="56" font-size="12" fill="#15803D" font-weight="600">抓異常值與跨組分布利器</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. 關係 (Relationship) -->
  <!-- ========================================== -->
  <g transform="translate(36, 462)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="1088" height="92" rx="10" fill="#F0FDF4" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- 類別徽章 -->
    <rect x="18" y="16" width="130" height="60" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.2" />
    <text x="83" y="42" class="cat-title" fill="#15803D">關係</text>
    <text x="83" y="60" class="cat-en" fill="#16A34A">Relationship</text>

    <!-- 樹狀分支連線 -->
    <path d="M 148 46 C 175 46, 185 20, 210 20" class="branch-line" stroke="#86EFAC" />
    <path d="M 148 46 C 175 46, 185 46, 210 46" class="branch-line" stroke="#86EFAC" />
    <path d="M 148 46 C 175 46, 185 72, 210 72" class="branch-line" stroke="#86EFAC" />

    <!-- 分支 1 -->
    <circle cx="210" cy="20" r="3.5" class="node-dot" stroke="#15803D" />
    <text x="224" y="24" class="branch-text">2 個連續數值變數（成對數據）</text>
    <line x1="430" y1="20" x2="620" y2="20" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="24" class="chart-name">散佈圖</text><text x="700" y="24" class="chart-en">Scatter Plot</text>
    <text x="960" y="24" font-size="12" fill="#DC2626" font-weight="600">勿用線將點串連；相關≠因果</text>

    <!-- 分支 2 -->
    <circle cx="210" cy="46" r="3.5" class="node-dot" stroke="#15803D" />
    <text x="224" y="50" class="branch-text">2 個數值變數 + 1 個氣泡大小維度</text>
    <line x1="430" y1="46" x2="620" y2="46" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="50" class="chart-name">氣泡圖</text><text x="700" y="50" class="chart-en">Bubble Chart</text>
    <text x="960" y="50" font-size="12" fill="#64748B">面積依半徑平方縮放</text>

    <!-- 分支 3 -->
    <circle cx="210" cy="72" r="3.5" class="node-dot" stroke="#15803D" />
    <text x="224" y="76" class="branch-text">多個數值變數間的相互關聯性</text>
    <line x1="430" y1="72" x2="620" y2="72" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="76" class="chart-name">相關係數熱力圖</text><text x="770" y="76" class="chart-en">Heatmap</text>
    <text x="960" y="76" font-size="12" fill="#64748B">搭配雙色漸層色階（-1 到 +1）</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. 趨勢 (Trend) -->
  <!-- ========================================== -->
  <g transform="translate(36, 566)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="1088" height="92" rx="10" fill="#FEF2F2" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- 類別徽章 -->
    <rect x="18" y="16" width="130" height="60" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2" />
    <text x="83" y="42" class="cat-title" fill="#B91C1C">趨勢</text>
    <text x="83" y="60" class="cat-en" fill="#DC2626">Trend</text>

    <!-- 樹狀分支連線 -->
    <path d="M 148 46 C 175 46, 185 20, 210 20" class="branch-line" stroke="#FCA5A5" />
    <path d="M 148 46 C 175 46, 185 46, 210 46" class="branch-line" stroke="#FCA5A5" />
    <path d="M 148 46 C 175 46, 185 72, 210 72" class="branch-line" stroke="#FCA5A5" />

    <!-- 分支 1 -->
    <circle cx="210" cy="20" r="3.5" class="node-dot" stroke="#DC2626" />
    <text x="224" y="24" class="branch-text">時間點連續且較多（&gt; 5 個）</text>
    <line x1="430" y1="20" x2="620" y2="20" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="24" class="chart-name">折線圖</text><text x="700" y="24" class="chart-en">Line Chart</text>
    <text x="960" y="24" font-size="12" fill="#15803D" font-weight="600">時序必須嚴格由左至右</text>

    <!-- 分支 2 -->
    <circle cx="210" cy="46" r="3.5" class="node-dot" stroke="#DC2626" />
    <text x="224" y="50" class="branch-text">時間點極少（僅 3~4 個季度或年份）</text>
    <line x1="430" y1="46" x2="620" y2="46" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="50" class="chart-name">時間長條圖</text><text x="735" y="50" class="chart-en">Time-series Bar</text>
    <text x="960" y="50" font-size="12" fill="#64748B">點少時長條圖比折線更穩重</text>

    <!-- 分支 3 -->
    <circle cx="210" cy="72" r="3.5" class="node-dot" stroke="#DC2626" />
    <text x="224" y="76" class="branch-text">多類別隨時間演進的累積組成</text>
    <line x1="430" y1="72" x2="620" y2="72" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
    <text x="640" y="76" class="chart-name">堆疊面積圖</text><text x="735" y="76" class="chart-en">Stacked Area</text>
    <text x="960" y="76" font-size="12" fill="#64748B">注意底部累積基準的波動影響</text>
  </g>

  <!-- 底部備註 -->
  <g transform="translate(36, 696)">
    <circle cx="6" cy="6" r="4" fill="#2563EB" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="12" fill="#64748B">
      核心口訣：比高低用長條、看比例算分母、看集中用分布、看連動用散佈、看時間走勢用折線。
    </text>
  </g>
</svg>
