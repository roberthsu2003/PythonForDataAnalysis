<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-label="長條圖以部門為類別、每人平均支出為數值；業務部最高。示意資料。">
  <title>比較｜長條圖</title><desc>長條圖以部門為類別、每人平均支出為數值；業務部最高。示意資料。</desc>
  <style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #172033; }
  .title { font-size: 23px; font-weight: 800; }
  .question { font-size: 17px; font-weight: 600; fill: #475569; }
  .axis { font-size: 15px; fill: #475569; }
  .note { font-size: 15px; font-weight: 700; fill: #334155; }
  .inverse { fill: #ffffff; }
</style>
  <rect x="1" y="1" width="698" height="248" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="20" width="6" height="43" rx="3" fill="#2563eb"/>
  <text x="39" y="40" class="title">比較｜長條圖</text>
  <text x="39" y="65" class="question">哪個部門每人平均支出最高？</text>
  <line x1="70" y1="192" x2="648" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="85" x2="70" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <text x="37" y="102" class="axis">萬元</text><text x="51" y="194" class="axis">0</text>
  <rect x="107" y="137" width="58" height="55" rx="4" fill="#93c5fd"/>
  <rect x="219" y="126" width="58" height="66" rx="4" fill="#60a5fa"/>
  <rect x="331" y="92" width="58" height="100" rx="4" fill="#2563eb"/>
  <rect x="443" y="115" width="58" height="77" rx="4" fill="#60a5fa"/>
  <rect x="555" y="132" width="58" height="60" rx="4" fill="#93c5fd"/>
  <text x="118" y="210" class="axis">行政</text><text x="230" y="210" class="axis">財務</text>
  <text x="342" y="210" class="axis">業務</text><text x="454" y="210" class="axis">資訊</text>
  <text x="566" y="210" class="axis">人資</text>
  <text x="34" y="232" class="note">看長條高度：業務部最高；數值軸從 0 開始。</text>
</svg>
