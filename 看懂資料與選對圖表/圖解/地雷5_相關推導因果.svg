<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="260" viewBox="0 0 1088 260" role="img" aria-label="把相關性直接說成因果關係 (Correlation ≠ Causation)">
  <title>把相關性直接說成因果關係 (Correlation ≠ Causation)</title>
  <defs>
    <style>
      .row-tag { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 13px; font-weight: 800; }
      .box-title-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #166534; }
      .box-title-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #991B1B; }
      .box-desc-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #14532D; }
      .box-desc-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #7F1D1D; }
      .chart-label { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 11px; fill: #475569; font-weight: 600; }
      .chart-axis { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; fill: #94A3B8; }
      .stat-val { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 11px; font-weight: 800; }
    </style>
    <filter id="c-shadow" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- 單列小標籤 -->
  <rect x="0" y="0" width="1088" height="26" rx="5" fill="#F1F5F9" />
  <rect x="0" y="0" width="60" height="26" rx="5" fill="#0F172A" />
  <text x="30" y="17" class="row-tag" fill="#FFFFFF" text-anchor="middle">地雷 5</text>
  <text x="72" y="17" class="row-tag" fill="#1E293B">把相關性直接說成因果關係 (Correlation ≠ Causation)</text>

  <!-- 左邊：✅ 正確做法 (寬 530, 高 210) -->
  <g transform="translate(0, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#F0FDF4" />
    <rect x="0" y="24" width="530" height="10" fill="#F0FDF4" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#DCFCE7" stroke-width="1" />
    <text x="14" y="22" class="box-title-c">✅ 散佈圖呈現關聯・客觀標註統計相關係數</text>
    <text x="14" y="52" class="box-desc-c">標註「喝咖啡與業績具正相關 (r=0.72)」，並提醒可能受工時或職位第三變數影響。</text>
    <g transform="translate(130, 52)">
      
              <line x1="40" y1="120" x2="220" y2="120" stroke="#CBD5E1" stroke-width="1.2" />
              <line x1="40" y1="25" x2="40" y2="120" stroke="#CBD5E1" stroke-width="1.2" />
              <text x="220" y="133" class="chart-axis" text-anchor="end">X: 每日咖啡杯數</text>
              <text x="45" y="28" class="chart-axis">Y: 業績額</text>
              <circle cx="65" cy="105" r="3.5" fill="#16A34A" />
              <circle cx="90" cy="95" r="3.5" fill="#16A34A" />
              <circle cx="115" cy="80" r="3.5" fill="#16A34A" />
              <circle cx="140" cy="65" r="3.5" fill="#16A34A" />
              <circle cx="170" cy="50" r="3.5" fill="#16A34A" />
              <circle cx="200" cy="38" r="3.5" fill="#16A34A" />
              <line x1="55" y1="110" x2="205" y2="35" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3,3" />
              <text x="135" y="22" font-size="9" fill="#15803D" font-weight="700" text-anchor="middle">具統計相關 (r=0.72) 不妄斷因果</text>
            
    </g>
  </g>

  <!-- 右邊：❌ 錯誤地雷 (寬 530, 高 210) -->
  <g transform="translate(558, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#FEF2F2" />
    <rect x="0" y="24" width="530" height="10" fill="#FEF2F2" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#FEE2E2" stroke-width="1" />
    <text x="14" y="22" class="box-title-w">❌ 倒果為因・直接推論「喝咖啡能提高業績」</text>
    <text x="14" y="52" class="box-desc-w">妄斷因果導致荒謬決策，例如「強制全體業務每日灌咖啡來拯救業績」。</text>
    <g transform="translate(130, 52)">
      
              <g transform="translate(130, 75)">
                <rect x="-95" y="-50" width="80" height="42" rx="6" fill="#FEE2E2" stroke="#DC2626" />
                <text x="-55" y="-30" font-size="10" fill="#991B1B" font-weight="800" text-anchor="middle">多喝咖啡</text>
                <text x="-55" y="-14" font-size="8.5" fill="#7F1D1D" text-anchor="middle">(因?)</text>

                <!-- 大箭頭 -->
                <path d="M -5 -29 L 20 -29" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#red-arrow)" />

                <rect x="25" y="-50" width="80" height="42" rx="6" fill="#FEE2E2" stroke="#DC2626" />
                <text x="65" y="-30" font-size="10" fill="#991B1B" font-weight="800" text-anchor="middle">業績暴增</text>
                <text x="65" y="-14" font-size="8.5" fill="#7F1D1D" text-anchor="middle">(果?)</text>
                
                <text x="5" y="22" font-size="9" fill="#DC2626" font-weight="800" text-anchor="middle">荒謬推論：逼業務喝咖啡！</text>
                <text x="5" y="38" font-size="8" fill="#7F1D1D" text-anchor="middle">（真相：常加班者兩者皆高，為第三變數干擾）</text>
              </g>
            
    </g>
  </g>
</svg>
