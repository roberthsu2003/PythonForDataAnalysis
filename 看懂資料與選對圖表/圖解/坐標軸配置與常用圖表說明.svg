<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="坐標軸配置與常用圖表基礎">
  <title>常用圖表名稱、X/Y 軸配置與核心用途全景圖</title>
  
  <defs>
    <!-- 箭頭 marker -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#1E293B"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', 'Consolas', 'Menlo', 'Noto Sans Mono CJK TC', monospace; }
  </style>

  <!-- 外層背景 -->
  <rect x="2" y="2" width="1076" height="656" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 頂部標題區 -->
  <rect x="24" y="16" width="1032" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="44" y="42" class="font-sans" font-size="16" font-weight="bold" fill="#0F172A">📐 常用圖表名稱、X/Y 軸配置法則與核心用途全景圖</text>
  <text x="730" y="42" class="font-sans" font-size="13" font-weight="500" fill="#64748B">學會座標軸職責與英文代稱，精準向 AI 下指令</text>

  <!-- ==================== 左側：X/Y 軸黃金配置法則 ==================== -->
  <g filter="url(#card-shadow)">
    <rect x="24" y="72" width="360" height="562" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
  </g>
  
  <!-- 左卡標題 -->
  <rect x="40" y="86" width="160" height="28" rx="6" fill="#E0F2FE"/>
  <text x="50" y="105" class="font-sans" font-size="13" font-weight="bold" fill="#0369A1">🎯 坐標軸配置黃金法則</text>

  <!-- 坐標軸示意圖 -->
  <rect x="40" y="124" width="328" height="236" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Y 軸 -->
  <line x1="85" y1="315" x2="85" y2="155" stroke="#1E293B" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="60" y="148" class="font-sans" font-size="12" font-weight="bold" fill="#0369A1">Y 軸 (縱軸)</text>
  
  <!-- Y 軸說明膠囊 -->
  <rect x="98" y="160" width="250" height="56" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="108" y="180" class="font-sans" font-size="12" font-weight="bold" fill="#166534">指標 / 結果 (Metric)</text>
  <text x="108" y="198" class="font-sans" font-size="11" fill="#4B5563">連續數值（金額、工時、銷量、人數）</text>
  <text x="108" y="210" class="font-sans" font-size="10" font-weight="bold" fill="#DC2626">⚠️ 長條圖 Y 軸必須從 0 起算！</text>

  <!-- X 軸 -->
  <line x1="85" y1="315" x2="335" y2="315" stroke="#1E293B" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="290" y="338" class="font-sans" font-size="12" font-weight="bold" fill="#D97706">X 軸 (橫軸)</text>

  <!-- X 軸說明膠囊 -->
  <rect x="98" y="234" width="250" height="56" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="108" y="254" class="font-sans" font-size="12" font-weight="bold" fill="#B45309">條件 / 維度 (Dimension)</text>
  <text x="108" y="272" class="font-sans" font-size="11" fill="#4B5563">分類類別（部門、產品）或 時間序</text>
  <text x="108" y="284" class="font-sans" font-size="10" fill="#64748B">時間型態必須嚴格由早到晚遞增</text>

  <!-- 重要例外：水平長條圖 -->
  <rect x="40" y="374" width="328" height="136" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
  <text x="54" y="398" class="font-sans" font-size="13" font-weight="bold" fill="#C2410C">🔄 關鍵例外：水平長條圖 (Bar Chart)</text>
  <text x="54" y="420" class="font-sans" font-size="11.5" fill="#1E293B">何時 X/Y 軸對調？</text>
  <text x="54" y="440" class="font-sans" font-size="11" fill="#4B5563">• 類別名稱很長（如：「顧客關係管理部」）</text>
  <text x="54" y="458" class="font-sans" font-size="11" fill="#4B5563">• 項目很多（≥ 7 個）硬放 X 軸文字會打架</text>
  <text x="54" y="482" class="font-sans" font-size="11.5" font-weight="bold" fill="#EA580C">➔ Y 軸改放類別名稱，X 軸放數值（橫向展開）</text>
  <text x="54" y="498" class="font-sans" font-size="10.5" fill="#78350F">（文字由左至右水平閱讀最舒適，請依數值排序）</text>

  <!-- 避雷紅線小卡 -->
  <rect x="40" y="522" width="328" height="96" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="54" y="544" class="font-sans" font-size="12" font-weight="bold" fill="#991B1B">🛑 坐標軸兩大嚴格禁忌</text>
  <text x="54" y="566" class="font-sans" font-size="11" fill="#4B5563">1. ❌ 員工工號等 ID 標識碼絕不能放 X/Y 軸運算</text>
  <text x="54" y="586" class="font-sans" font-size="11" fill="#4B5563">2. ❌ 非時間類別（如部門）嚴禁在 X 軸上連成折線</text>
  <text x="54" y="604" class="font-sans" font-size="10.5" fill="#64748B">折線斜率專屬時間演變，任意串連會造成虛假趨勢</text>

  <!-- ==================== 右側：核心圖表形態與對照 ==================== -->
  <g filter="url(#card-shadow)">
    <rect x="400" y="72" width="656" height="562" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  </g>

  <!-- 右卡標題 -->
  <rect x="416" y="86" width="220" height="28" rx="6" fill="#F1F5F9"/>
  <text x="426" y="105" class="font-sans" font-size="13" font-weight="bold" fill="#334155">📚 本教材常用 8 大圖表速覽</text>

  <!-- 圖表網格 (2 列 x 4 欄 = 8 張迷你卡片) -->

  <!-- 卡片 1：垂直長條圖 -->
  <rect x="416" y="126" width="150" height="114" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="426" y="148" class="font-sans" font-size="12" font-weight="bold" fill="#166534">📊 垂直長條圖</text>
  <text x="426" y="165" class="font-mono" font-size="10" fill="#15803D">Column Chart</text>
  <text x="426" y="185" class="font-sans" font-size="10" fill="#4B5563">X 軸：類別 (&lt; 7)</text>
  <text x="426" y="200" class="font-sans" font-size="10" fill="#4B5563">Y 軸：數值 (從0起)</text>
  <text x="426" y="222" class="font-sans" font-size="10.5" font-weight="bold" fill="#166534">比少數類別高低</text>

  <!-- 卡片 2：水平長條圖 -->
  <rect x="578" y="126" width="150" height="114" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="588" y="148" class="font-sans" font-size="12" font-weight="bold" fill="#166534">📊 水平長條圖</text>
  <text x="588" y="165" class="font-mono" font-size="10" fill="#15803D">Bar Chart (barh)</text>
  <text x="588" y="185" class="font-sans" font-size="10" fill="#4B5563">X 軸：數值 (從0起)</text>
  <text x="588" y="200" class="font-sans" font-size="10" fill="#4B5563">Y 軸：類別 (長標籤)</text>
  <text x="588" y="222" class="font-sans" font-size="10.5" font-weight="bold" fill="#166534">排名比大小首選</text>

  <!-- 卡片 3：分組長條圖 -->
  <rect x="740" y="126" width="150" height="114" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="750" y="148" class="font-sans" font-size="12" font-weight="bold" fill="#166534">📊 分組長條圖</text>
  <text x="750" y="165" class="font-mono" font-size="10" fill="#15803D">Grouped Bar</text>
  <text x="750" y="185" class="font-sans" font-size="10" fill="#4B5563">X 軸：主類別</text>
  <text x="750" y="200" class="font-sans" font-size="10" fill="#4B5563">圖例：次指標 (今年/去年)</text>
  <text x="750" y="222" class="font-sans" font-size="10.5" font-weight="bold" fill="#166534">同類別比雙指標</text>

  <!-- 卡片 4：百分比長條圖 -->
  <rect x="902" y="126" width="138" height="114" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="912" y="148" class="font-sans" font-size="12" font-weight="bold" fill="#C2410C">📊 百分比長條</text>
  <text x="912" y="165" class="font-mono" font-size="10" fill="#EA580C">100% Stacked</text>
  <text x="912" y="185" class="font-sans" font-size="10" fill="#4B5563">軸線：類別 / 100%</text>
  <text x="912" y="200" class="font-sans" font-size="10" fill="#4B5563">特徵：各色塊合為1</text>
  <text x="912" y="222" class="font-sans" font-size="10.5" font-weight="bold" fill="#C2410C">看結構佔比首選</text>

  <!-- 卡片 5：圓餅甜甜圈圖 -->
  <rect x="416" y="254" width="150" height="114" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="426" y="276" class="font-sans" font-size="12" font-weight="bold" fill="#C2410C">🥧 甜甜圈/圓餅</text>
  <text x="426" y="293" class="font-mono" font-size="10" fill="#EA580C">Pie / Donut</text>
  <text x="426" y="313" class="font-sans" font-size="10" fill="#4B5563">無 X/Y 軸（角度弧長）</text>
  <text x="426" y="328" class="font-sans" font-size="10" fill="#DC2626">限制：類別 ≤ 4 個</text>
  <text x="426" y="350" class="font-sans" font-size="10.5" font-weight="bold" fill="#C2410C">看單一主導佔比</text>

  <!-- 卡片 6：直方圖 -->
  <rect x="578" y="254" width="150" height="114" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.2"/>
  <text x="588" y="276" class="font-sans" font-size="12" font-weight="bold" fill="#7E22CE">📶 直方圖</text>
  <text x="588" y="293" class="font-mono" font-size="10" fill="#9333EA">Histogram (hist)</text>
  <text x="588" y="313" class="font-sans" font-size="10" fill="#4B5563">X 軸：數值連續 Bins</text>
  <text x="588" y="328" class="font-sans" font-size="10" fill="#4B5563">Y 軸：次數／筆數</text>
  <text x="588" y="350" class="font-sans" font-size="10.5" font-weight="bold" fill="#7E22CE">看數字集中哪裡</text>

  <!-- 卡片 7：箱形圖 -->
  <rect x="740" y="254" width="150" height="114" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.2"/>
  <text x="750" y="276" class="font-sans" font-size="12" font-weight="bold" fill="#7E22CE">📦 箱形圖</text>
  <text x="750" y="293" class="font-mono" font-size="10" fill="#9333EA">Box Plot</text>
  <text x="750" y="313" class="font-sans" font-size="10" fill="#4B5563">軸線：數值 (五數概括)</text>
  <text x="750" y="328" class="font-sans" font-size="10" fill="#4B5563">特徵：中位數/四分位</text>
  <text x="750" y="350" class="font-sans" font-size="10.5" font-weight="bold" fill="#7E22CE">秒抓極端異常值</text>

  <!-- 卡片 8：散佈圖 -->
  <rect x="902" y="254" width="138" height="114" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/>
  <text x="912" y="276" class="font-sans" font-size="12" font-weight="bold" fill="#BE123C">🔘 散佈圖</text>
  <text x="912" y="293" class="font-mono" font-size="10" fill="#E11D48">Scatter Plot</text>
  <text x="912" y="313" class="font-sans" font-size="10" fill="#4B5563">X 軸：數值變數 A</text>
  <text x="912" y="328" class="font-sans" font-size="10" fill="#4B5563">Y 軸：數值變數 B</text>
  <text x="912" y="350" class="font-sans" font-size="10.5" font-weight="bold" fill="#BE123C">看兩者是否連動</text>

  <!-- 下方大橫幅：折線圖與相關熱力圖 -->
  <!-- 卡片 9：折線圖 (左) -->
  <rect x="416" y="382" width="312" height="106" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="430" y="406" class="font-sans" font-size="13" font-weight="bold" fill="#0369A1">📈 折線圖 (Line Chart)</text>
  <text x="430" y="428" class="font-sans" font-size="11" fill="#4B5563">X 軸：<tspan font-weight="bold" fill="#0369A1">嚴格遞增的時間型態</tspan>（日期、月份、季度）</text>
  <text x="430" y="448" class="font-sans" font-size="11" fill="#4B5563">Y 軸：連續數值指標 ➔ <tspan font-weight="bold">看長期走勢變化與週期性</tspan></text>
  <text x="430" y="468" class="font-sans" font-size="10.5" fill="#DC2626">⚠️ 嚴禁將部門或人員等無先後順序的類別連成折線！</text>

  <!-- 卡片 10：相關熱力圖 (右) -->
  <rect x="740" y="382" width="300" height="106" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/>
  <text x="754" y="406" class="font-sans" font-size="13" font-weight="bold" fill="#BE123C">🌡️ 相關係數熱力圖 (Heatmap)</text>
  <text x="754" y="428" class="font-sans" font-size="11" fill="#4B5563">X/Y 軸：均為各個連續數值欄位名稱矩陣</text>
  <text x="754" y="448" class="font-sans" font-size="11" fill="#4B5563">顏色深淺：相關係數 r (-1 ~ +1) ➔ <tspan font-weight="bold">全景掃描關係</tspan></text>
  <text x="754" y="468" class="font-sans" font-size="10.5" fill="#9F1239">⚠️ 相關性不代表因果性，切勿斷言「A 導致 B」！</text>

  <!-- 底部向 AI 提問的 Prompt 快速模板 -->
  <rect x="416" y="502" width="624" height="116" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="430" y="524" class="font-sans" font-size="12" font-weight="bold" fill="#334155">💡 與 AI 對話時的「座標軸明確提問心法」：</text>
  <rect x="430" y="534" width="596" height="70" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="442" y="554" class="font-mono" font-size="11" fill="#2563EB">「請幫我畫一張 [圖表英文名稱，例如：水平長條圖 Horizontal Bar]，</text>
  <text x="442" y="572" class="font-mono" font-size="11" fill="#2563EB">  將 [欄位A] 放在 Y 軸 (類別維度)，將 [欄位B] 放在 X 軸 (數值指標從0起算)，</text>
  <text x="442" y="590" class="font-mono" font-size="11" fill="#2563EB">  依數值由大到小排序，標註繁體中文單位並提供客觀解讀。」</text>

</svg>
