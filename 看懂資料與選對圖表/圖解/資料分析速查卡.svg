<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="100%" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; }
    .h1 { font-size: 32px; font-weight: 800; fill: #0F172A; }
    .sub { font-size: 16px; fill: #475569; font-weight: 500; }
    .step-title { font-size: 18px; font-weight: 800; }
    .step-hint { font-size: 14px; fill: #334155; font-weight: 600; }
    .card-title { font-size: 19px; font-weight: 800; fill: #0F172A; }
    .badge { font-size: 13px; font-weight: 800; }
    .label-name { font-size: 18px; font-weight: 800; fill: #0F172A; }
    .item { font-size: 14.5px; fill: #334155; font-weight: 500; }
    .item-muted { font-size: 13px; fill: #64748B; }
    .item-strong { font-size: 15px; font-weight: 800; fill: #0F172A; }
    .item-small { font-size: 13px; fill: #475569; font-weight: 500; }
    .th { font-size: 13px; font-weight: 800; fill: #64748B; letter-spacing: 0.05em; }
    .kind { font-size: 15px; font-weight: 800; }
    .warn { font-size: 13.5px; font-weight: 700; fill: #BE123C; }
    .mine { font-size: 14.5px; font-weight: 700; fill: #BE123C; }
    .stage { font-size: 13px; font-weight: 800; }
    .check-title { font-size: 20px; font-weight: 800; fill: #FFFFFF; }
    .check { font-size: 17px; font-weight: 600; fill: #E2E8F0; }
    .foot { font-size: 12px; fill: #94A3B8; }
  </style>
  <rect width="1200" height="1060" fill="url(#bg)"/>
  <text x="60" y="64" class="h1" text-anchor="start">資料分析速查卡</text>
  <text x="60" y="96" class="sub" text-anchor="start">看懂資料 ➜ 選對圖表 ➜ 指揮 AI：做每一個範例時放在旁邊，卡住就看這一張</text>
  <rect x="60" y="128" width="192" height="92" rx="14" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-opacity="0.35"/>
  <text x="156.0" y="162" class="step-title" text-anchor="middle" fill="#2563EB">① 欄位貼標籤</text>
  <text x="156.0" y="192" class="step-hint" text-anchor="middle">一列代表什麼？</text>
  <path d="M 257 174 L 277 174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="282" y="128" width="192" height="92" rx="14" fill="#0891B2" fill-opacity="0.08" stroke="#0891B2" stroke-opacity="0.35"/>
  <text x="378.0" y="162" class="step-title" text-anchor="middle" fill="#0891B2">② 套提問積木</text>
  <text x="378.0" y="192" class="step-hint" text-anchor="middle">挑 1～3 個欄位問</text>
  <path d="M 479 174 L 499 174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="504" y="128" width="192" height="92" rx="14" fill="#C2410C" fill-opacity="0.08" stroke="#C2410C" stroke-opacity="0.35"/>
  <text x="600.0" y="162" class="step-title" text-anchor="middle" fill="#C2410C">③ 邊界檢核</text>
  <text x="600.0" y="192" class="step-hint" text-anchor="middle">先找「不能問」的</text>
  <path d="M 701 174 L 721 174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="726" y="128" width="192" height="92" rx="14" fill="#7E22CE" fill-opacity="0.08" stroke="#7E22CE" stroke-opacity="0.35"/>
  <text x="822.0" y="162" class="step-title" text-anchor="middle" fill="#7E22CE">④ 選對圖表</text>
  <text x="822.0" y="192" class="step-hint" text-anchor="middle">問題類別決定圖表</text>
  <path d="M 923 174 L 943 174" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="948" y="128" width="192" height="92" rx="14" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-opacity="0.35"/>
  <text x="1044.0" y="162" class="step-title" text-anchor="middle" fill="#047857">⑤ 指揮 AI 並驗收</text>
  <text x="1044.0" y="192" class="step-hint" text-anchor="middle">數字能回查原始資料</text>
  <rect x="60" y="250" width="420" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="60" y="250" width="6" height="300" rx="3" fill="#2563EB"/>
  <rect x="82" y="268" width="83" height="24" rx="12" fill="#2563EB" fill-opacity="0.12"/>
  <text x="91" y="285" class="badge" text-anchor="start" fill="#2563EB">第 1 課</text>
  <text x="177" y="286" class="card-title" text-anchor="start">欄位三標籤</text>
  <circle cx="92" cy="324" r="8" fill="#16A34A"/>
  <text x="108" y="330" class="label-name" text-anchor="start">指標</text>
  <text x="176" y="322" class="item" text-anchor="start">有單位的數字</text>
  <text x="176" y="344" class="item-muted" text-anchor="start">例：金額、工時、人數</text>
  <text x="456" y="333" class="item-strong" text-anchor="end" fill="#0F172A">加總、平均、比大小</text>
  <circle cx="92" cy="396" r="8" fill="#2563EB"/>
  <text x="108" y="402" class="label-name" text-anchor="start">條件</text>
  <text x="176" y="394" class="item" text-anchor="start">文字類別或日期</text>
  <text x="176" y="416" class="item-muted" text-anchor="start">例：部門、類別、月份</text>
  <text x="456" y="405" class="item-strong" text-anchor="end" fill="#0F172A">分組、排序</text>
  <circle cx="92" cy="468" r="8" fill="#94A3B8"/>
  <text x="108" y="474" class="label-name" text-anchor="start">標識</text>
  <text x="176" y="466" class="item" text-anchor="start">每列都不同的編號</text>
  <text x="176" y="488" class="item-muted" text-anchor="start">例：員工編號、訂單編號</text>
  <text x="456" y="477" class="item-strong" text-anchor="end" fill="#BE123C">只能數筆數！</text>
  <text x="84" y="532" class="warn" text-anchor="start">⚠ 編號「10023」長得像數字，但它是標識，不能算平均</text>
  <rect x="510" y="250" width="630" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="510" y="250" width="6" height="300" rx="3" fill="#7E22CE"/>
  <rect x="532" y="268" width="109" height="24" rx="12" fill="#7E22CE" fill-opacity="0.12"/>
  <text x="541" y="285" class="badge" text-anchor="start" fill="#7E22CE">第 4～6 課</text>
  <text x="653" y="286" class="card-title" text-anchor="start">五大問題 ➜ 首選圖表</text>
  <text x="534" y="324" class="th" text-anchor="start">類別</text>
  <text x="616" y="324" class="th" text-anchor="start">聽到這種話</text>
  <text x="752" y="324" class="th" text-anchor="start">首選圖表</text>
  <text x="890" y="324" class="th" text-anchor="start">關鍵提醒</text>
  <rect x="530" y="336" width="60" height="28" rx="8" fill="#2563EB" fill-opacity="0.12"/>
  <text x="560" y="356" class="kind" text-anchor="middle" fill="#2563EB">比較</text>
  <text x="616" y="356" class="item" text-anchor="start">最高？排名？</text>
  <text x="752" y="356" class="item-strong" text-anchor="start">長條圖</text>
  <text x="890" y="356" class="item-small" text-anchor="start">≤6 項用垂直；項目多、名稱長用水平</text>
  <rect x="530" y="376" width="60" height="28" rx="8" fill="#C2410C" fill-opacity="0.12"/>
  <text x="560" y="396" class="kind" text-anchor="middle" fill="#C2410C">組成</text>
  <text x="616" y="396" class="item" text-anchor="start">各占多少？</text>
  <text x="752" y="396" class="item-strong" text-anchor="start">百分比長條圖</text>
  <text x="890" y="396" class="item-small" text-anchor="start">類別 ≤4 才考慮圓餅；先寫分母</text>
  <rect x="530" y="416" width="60" height="28" rx="8" fill="#7E22CE" fill-opacity="0.12"/>
  <text x="560" y="436" class="kind" text-anchor="middle" fill="#7E22CE">分布</text>
  <text x="616" y="436" class="item" text-anchor="start">大多落在哪？</text>
  <text x="752" y="436" class="item-strong" text-anchor="start">直方圖／箱形圖</text>
  <text x="890" y="436" class="item-small" text-anchor="start">平均數與中位數一起看</text>
  <rect x="530" y="456" width="60" height="28" rx="8" fill="#BE123C" fill-opacity="0.12"/>
  <text x="560" y="476" class="kind" text-anchor="middle" fill="#BE123C">關係</text>
  <text x="616" y="476" class="item" text-anchor="start">A 大 B 也大？</text>
  <text x="752" y="476" class="item-strong" text-anchor="start">散佈圖</text>
  <text x="890" y="476" class="item-small" text-anchor="start">點不連線；相關≠因果</text>
  <rect x="530" y="496" width="60" height="28" rx="8" fill="#047857" fill-opacity="0.12"/>
  <text x="560" y="516" class="kind" text-anchor="middle" fill="#047857">趨勢</text>
  <text x="616" y="516" class="item" text-anchor="start">怎麼變化？</text>
  <text x="752" y="516" class="item-strong" text-anchor="start">折線圖</text>
  <text x="890" y="516" class="item-small" text-anchor="start">時間由早到晚；只有 3～4 點用長條</text>
  <rect x="60" y="580" width="540" height="250" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="60" y="580" width="6" height="250" rx="3" fill="#BE123C"/>
  <rect x="82" y="598" width="83" height="24" rx="12" fill="#BE123C" fill-opacity="0.12"/>
  <text x="91" y="615" class="badge" text-anchor="start" fill="#BE123C">第 6 課</text>
  <text x="177" y="616" class="card-title" text-anchor="start">六大圖表地雷</text>
  <text x="84" y="660" class="mine" text-anchor="start">✗ 長條圖數值軸沒從 0 開始</text>
  <text x="576" y="660" class="item-small" text-anchor="end">→ 差距被放大好幾倍</text>
  <text x="84" y="687" class="mine" text-anchor="start">✗ 圓餅圖切成 5 塊以上</text>
  <text x="576" y="687" class="item-small" text-anchor="end">→ 改用排序的長條圖</text>
  <text x="84" y="714" class="mine" text-anchor="start">✗ 把沒有順序的類別連成折線</text>
  <text x="576" y="714" class="item-small" text-anchor="end">→ 只有時間能連線</text>
  <text x="84" y="741" class="mine" text-anchor="start">✗ 百分比沒寫分母</text>
  <text x="576" y="741" class="item-small" text-anchor="end">→ 5 人和 500 人差很多</text>
  <text x="84" y="768" class="mine" text-anchor="start">✗ 把相關說成因果</text>
  <text x="576" y="768" class="item-small" text-anchor="end">→ 只能說「一起變化」</text>
  <text x="84" y="795" class="mine" text-anchor="start">✗ 3D 效果、七彩配色</text>
  <text x="576" y="795" class="item-small" text-anchor="end">→ 平面＋只強調重點</text>
  <rect x="630" y="580" width="510" height="250" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="630" y="580" width="6" height="250" rx="3" fill="#047857"/>
  <rect x="652" y="598" width="83" height="24" rx="12" fill="#047857" fill-opacity="0.12"/>
  <text x="661" y="615" class="badge" text-anchor="start" fill="#047857">第 7 課</text>
  <text x="747" y="616" class="card-title" text-anchor="start">和 AI 協作：三階提問法</text>
  <rect x="652" y="644" width="62" height="26" rx="13" fill="#047857"/>
  <text x="683" y="662" class="stage" text-anchor="middle" fill="#FFFFFF">第一階</text>
  <text x="726" y="662" class="item-strong" text-anchor="start">看懂資料</text>
  <text x="726" y="684" class="item-small" text-anchor="start">「一列代表什麼？每欄是什麼角色？先不要畫圖。」</text>
  <rect x="652" y="698" width="62" height="26" rx="13" fill="#047857"/>
  <text x="683" y="716" class="stage" text-anchor="middle" fill="#FFFFFF">第二階</text>
  <text x="726" y="716" class="item-strong" text-anchor="start">一次一張圖</text>
  <text x="726" y="738" class="item-small" text-anchor="start">「回答【問題】，畫【圖表】，X 放…、Y 放…，從 0 開始。」</text>
  <rect x="652" y="752" width="62" height="26" rx="13" fill="#047857"/>
  <text x="683" y="770" class="stage" text-anchor="middle" fill="#FFFFFF">第三階</text>
  <text x="726" y="770" class="item-strong" text-anchor="start">說出限制</text>
  <text x="726" y="792" class="item-small" text-anchor="start">「用三句話說：結論、資料限制、不能推論的事。」</text>
  <rect x="60" y="860" width="1080" height="150" rx="14" fill="#0F172A"/>
  <text x="88" y="900" class="check-title" text-anchor="start">✔ 做完每一張圖，說得出這四句話才算真的懂</text>
  <text x="88" y="942" class="check" text-anchor="start">1. 這份資料「一列代表」＿＿＿</text>
  <text x="608" y="942" class="check" text-anchor="start">2. 我的「分母」是＿＿＿</text>
  <text x="88" y="982" class="check" text-anchor="start">3. 我選＿＿＿圖，因為＿＿＿</text>
  <text x="608" y="982" class="check" text-anchor="start">4. 這份資料「不能」推論＿＿＿</text>
  <text x="1140" y="1042" class="foot" text-anchor="end">看懂資料與選對圖表 × AI 協作資料分析</text>
</svg>
