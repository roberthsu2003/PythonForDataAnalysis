<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-label="直方圖以通勤時間區間為橫軸、人數為縱軸；三十至四十五分鐘的區間人數最多。示意資料。">
  <title>分布｜直方圖</title><desc>直方圖以通勤時間區間為橫軸、人數為縱軸；三十至四十五分鐘的區間人數最多。示意資料。</desc>
  <style>
  text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #172033; }
  .title { font-size: 23px; font-weight: 800; }
  .question { font-size: 17px; font-weight: 600; fill: #475569; }
  .axis { font-size: 15px; fill: #475569; }
  .note { font-size: 15px; font-weight: 700; fill: #334155; }
  .inverse { fill: #ffffff; }
</style>
  <rect x="1" y="1" width="698" height="248" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="20" width="6" height="43" rx="3" fill="#2563eb"/>
  <text x="39" y="40" class="title">分布｜直方圖</text>
  <text x="39" y="65" class="question">同仁通勤時間大多落在哪個區間？</text>
  <line x1="70" y1="191" x2="649" y2="191" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="89" x2="70" y2="191" stroke="#94a3b8" stroke-width="2"/>
  <text x="37" y="105" class="axis">人數</text>
  <rect x="95" y="160" width="98" height="31" fill="#93c5fd"/>
  <rect x="195" y="130" width="98" height="61" fill="#60a5fa"/>
  <rect x="295" y="100" width="98" height="91" fill="#2563eb"/>
  <rect x="395" y="139" width="98" height="52" fill="#60a5fa"/>
  <rect x="495" y="164" width="98" height="27" fill="#93c5fd"/>
  <text x="102" y="209" class="axis">0–15</text><text x="199" y="209" class="axis">15–30</text>
  <text x="298" y="209" class="axis">30–45</text><text x="397" y="209" class="axis">45–60</text>
  <text x="498" y="209" class="axis">60 以上</text>
  <text x="34" y="232" class="note">看最多人落在哪段：一根長條代表一個時間區間。</text>
</svg>
