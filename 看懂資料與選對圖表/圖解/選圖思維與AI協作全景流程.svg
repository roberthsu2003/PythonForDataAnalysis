<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- 背景平滑微漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- 箭頭端點 (箭頭只畫邊框或以乾淨三角形實心填色，絕不產生雜塊) -->
    <marker id="arrowGray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
  </defs>

  <style>
    path { fill: none; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; font-weight: 800; font-size: 26px; fill: #0F172A; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; font-size: 15px; fill: #475569; font-weight: 500; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; }
    
    .card-step-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 17px; font-weight: 800; fill: #0F172A; }
    .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 13.5px; fill: #334155; font-weight: 500; }
    .card-item-bold { font-weight: 700; fill: #0F172A; }
    .card-tip { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 12.5px; font-weight: 700; }
    .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 900; fill: #FFFFFF; }
  </style>

  <!-- 外層底板 -->
  <rect width="1140" height="760" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- 頂部 Header -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
    <text x="84" y="19" text-anchor="middle" class="tag-text" fill="#1D4ED8">STANDARDIZED WORKFLOW</text>
    <text x="0" y="62" class="title-main">選圖思維與 AI 協作全景決策流程</text>
    <text x="0" y="88" class="title-sub">六步標準思考鏈：不先跳進軟體工具，從數據本質出發，精準指揮 AI 產出具備洞察力的專業圖表</text>
  </g>

  <!-- ==================== 流程導引線 (嚴格填寫 fill="none"，修復黑塊問題) ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 第 1 排流向：Step 1 -> Step 2 -->
    <path d="M 370 230 L 406 230" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />
    <!-- 第 1 排流向：Step 2 -> Step 3 -->
    <path d="M 726 230 L 762 230" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />

    <!-- 跨排平滑大轉折：Step 3 右下方 -> Step 4 左上方 (純線段，無閉合路徑) -->
    <path d="M 922 340 L 922 375 Q 922 395 900 395 L 232 395 Q 210 395 210 415 L 210 435" 
          stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowBlue)" />

    <!-- 第 2 排流向：Step 4 -> Step 5 -->
    <path d="M 370 545 L 406 545" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />
    <!-- 第 2 排流向：Step 5 -> Step 6 -->
    <path d="M 726 545 L 762 545" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />
  </g>

  <!-- ========================================================
       STEP 01・盤點資料 DNA
       X: 50, Y: 135, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(50, 135)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#E0F2FE" />
    <circle cx="26" cy="19" r="11" fill="#0284C7" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">1</text>
    <text x="46" y="24" class="card-step-badge" fill="#0369A1">STEP 01・盤點欄位資料</text>
    
    <text x="22" y="68" class="card-title">檢驗欄位資料 DNA</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">🟢 指標 (Metric)</tspan>：金額、次數、工時（連續數值）</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">🔵 維度 (Dimension)</tspan>：部門、門市、品類（文字分類）</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">🟣 時間 (Time)</tspan>：日期、月份、季度（時序先後）</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#0284C7">💡 邊界防呆：識別碼 (ID) 與年份切忌計算平均！</text>
  </g>

  <!-- ========================================================
       STEP 02・提問思考
       X: 406, Y: 135, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(406, 135)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#FEF3C7" />
    <circle cx="26" cy="19" r="11" fill="#D97706" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">2</text>
    <text x="46" y="24" class="card-step-badge" fill="#B45309">STEP 02・發想商業提問</text>
    
    <text x="22" y="68" class="card-title">判斷「這組資料能回答什麼？」</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">• 組裝公式</tspan>：【在特定條件/維度下 ＋ 看指標結果】</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">• 釐清受眾</tspan>：高層看總體結構、單位主管看排名高低</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">• 邊界紅線</tspan>：缺時間不問趨勢、缺組別不比排名</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#D97706">💡 鎖定核心目標：拒絕毫無業務目的盲目拉圖</text>
  </g>

  <!-- ========================================================
       STEP 03・問題分類
       X: 762, Y: 135, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(762, 135)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#DCFCE7" />
    <circle cx="26" cy="19" r="11" fill="#16A34A" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">3</text>
    <text x="46" y="24" class="card-step-badge" fill="#15803D">STEP 03・歸納問題類別</text>
    
    <text x="22" y="68" class="card-title">五大核心分析問題類型</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">📊 比較 (Comparison)</tspan>：誰高誰低、差距多少、排名</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">📈 趨勢 (Trend)</tspan>：隨時間推移之成長、衰退、週期</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">🥧 組成 (Composition)</tspan>：各項占全體的份額百分比</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#16A34A">💡 延伸型：📶 分布 (區間極值) ｜ 🔗 關係 (雙數值聯動)</text>
  </g>

  <!-- ========================================================
       STEP 04・軸線與圖表 DNA
       X: 50, Y: 445, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(50, 445)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#EEF2FF" />
    <circle cx="26" cy="19" r="11" fill="#4F46E5" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">4</text>
    <text x="46" y="24" class="card-step-badge" fill="#4338CA">STEP 04・圖表與坐標軸</text>
    
    <text x="22" y="68" class="card-title">掌握圖表 DNA 與軸線配置</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">• 標準法則</tspan>：X 軸放維度(條件)，Y 軸放指標(結果)</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">• 垂直長條</tspan>：數值基準線「絕對必須從 0 起算」</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">• 水平對調</tspan>：項目多或名稱長 ➔ 轉水平長條圖</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#4F46E5">💡 避坑：長條圖 (柱有間距) vs 直方圖 (連續緊相連)</text>
  </g>

  <!-- ========================================================
       STEP 05・條件挑圖
       X: 406, Y: 445, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(406, 445)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#F3E8FF" />
    <circle cx="26" cy="19" r="11" fill="#9333EA" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">5</text>
    <text x="46" y="24" class="card-step-badge" fill="#7E22CE">STEP 05・依特徵精準選圖</text>
    
    <text x="22" y="68" class="card-title">依資料特徵條件二選一</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">• 比較類別</tspan>：項目 ≤ 6 垂直長條；項目 ≥ 7 水平長條</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">• 組成份額</tspan>：結構首選 100% 堆疊長條，少用圓餅</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">• 時間趨勢</tspan>：時序點多用折線圖；點極少用時間長條</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#9333EA">💡 避開地雷：嚴禁 3D 效果、無時序連線與隱匿分母</text>
  </g>

  <!-- ========================================================
       STEP 06・AI 協作
       X: 762, Y: 445, W: 320, H: 205
       ======================================================== -->
  <g transform="translate(762, 445)" filter="url(#cardShadow)">
    <rect width="320" height="205" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.8" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 38 L 0 38 Z" fill="#FFEDD5" />
    <circle cx="26" cy="19" r="11" fill="#EA580C" />
    <text x="26" y="23" text-anchor="middle" class="badge-num">6</text>
    <text x="46" y="24" class="card-step-badge" fill="#C2410C">STEP 06・三階梯指揮 AI</text>
    
    <text x="22" y="68" class="card-title">精準提示詞 (Prompt) 協作</text>
    <text x="22" y="96" class="card-item"><tspan class="card-item-bold">階梯 1 探索</tspan>：交代業務情境、分析目標與手邊欄位</text>
    <text x="22" y="121" class="card-item"><tspan class="card-item-bold">階梯 2 規格</tspan>：指定圖表類型、排序方向與 X/Y 軸配置</text>
    <text x="22" y="146" class="card-item"><tspan class="card-item-bold">階梯 3 產出</tspan>：要求數值標註、繁中字型與 3 句客觀解讀</text>
    
    <line x1="22" y1="164" x2="298" y2="164" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="22" y="186" class="card-tip" fill="#EA580C">💡 人機分工：AI 負責代碼繪圖，人類掌控業務決策</text>
  </g>

  <!-- ==================== 底部總結 Alert Banner ==================== -->
  <g transform="translate(50, 672)">
    <rect width="1040" height="52" rx="10" fill="#0F172A" />
    <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">💡</text>
    <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">
      黃金決策思維鏈：不是先想用什麼工具畫圖，而是「欄位角色限制提問 ➔ 問題類型縮小圖表範圍 ➔ 資料特徵拍板唯一圖表」！
    </text>
  </g>
</svg>
