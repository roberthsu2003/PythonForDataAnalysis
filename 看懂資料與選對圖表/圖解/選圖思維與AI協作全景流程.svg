<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <!-- 全域漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 步驟卡片漸層與陰影 -->
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 800; fill: #0F172A; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 14px; fill: #64748B; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 13px; fill: #475569; line-height: 1.5; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 11px; font-weight: 700; }
    .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  </style>

  <!-- 背景 -->
  <rect width="960" height="760" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部標題區 -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="69" y="17" text-anchor="middle" class="tag-text" fill="#1D4ED8">STANDARDIZED FLOW</text>
    <text x="0" y="58" class="title-text" font-size="24">選圖思維與 AI 協作全景決策流程</text>
    <text x="0" y="82" class="sub-text">六步思考鏈：不先跳進軟體工具，從資料本質出發，精準指揮 AI 產出符合商務規範的圖表</text>
  </g>

  <!-- 流程引導線 (連接線) -->
  <!-- 第 1 排：Step 1 -> Step 2 -> Step 3 -->
  <path d="M 315 235 L 355 235" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <path d="M 605 235 L 645 235" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- 轉折線：Step 3 -> Step 4 -->
  <path d="M 770 330 L 770 380 Q 770 405 745 405 L 645 405" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- 第 2 排：Step 4 <- Step 5 <- Step 6 (右到左逆轉或左到右佈局)
       為了符合由左至右閱讀習慣，我們讓第 2 排也由左至右，拐向轉折：
       Step 3 (右) 往下拉回到 Step 4 (左) -->
  
  <!-- 我們調整連接線路徑：從 Step 3 右側繞下到 Step 4 左側 -->
  <!-- 重新繪製平滑轉折線 -->
  <g>
    <!-- Step 3 到底部轉折回到 Step 4 -->
    <path d="M 770 330 L 770 365 Q 770 385 750 385 L 210 385 Q 190 385 190 405 L 190 425" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)" stroke-dasharray="6 4" />
    
    <!-- Step 4 -> Step 5 -->
    <path d="M 315 540 L 355 540" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />
    <!-- Step 5 -> Step 6 -->
    <path d="M 605 540 L 645 540" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== STEP 01 ==================== -->
  <g transform="translate(65, 140)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#E0F2FE" />
    <circle cx="24" cy="18" r="11" fill="#0284C7" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">1</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369A1">STEP 01・盤點資料</text>
    
    <text x="20" y="65" class="card-title">檢驗欄位資料 DNA</text>
    <text x="20" y="92" class="card-desc">• 🟢 指標 (Metric)：金額/次數/數量</text>
    <text x="20" y="114" class="card-desc">• 🔵 維度 (Dimension)：部門/門市/類別</text>
    <text x="20" y="136" class="card-desc">• 🟣 時間 (Time)：日期/年份/季度</text>
    <text x="20" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284C7">💡 防呆：ID 與年份不可計算平均</text>
  </g>

  <!-- ==================== STEP 02 ==================== -->
  <g transform="translate(355, 140)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#FEF3C7" />
    <circle cx="24" cy="18" r="11" fill="#D97706" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">2</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#B45309">STEP 02・提問思考</text>
    
    <text x="20" y="65" class="card-title">判斷「能回答什麼？」</text>
    <text x="20" y="92" class="card-desc">• 組裝公式：【在條件下＋看指標】</text>
    <text x="20" y="114" class="card-desc">• 釐清受眾：高層看總體、主管看排名</text>
    <text x="20" y="136" class="card-desc">• 邊界檢驗：缺時間就不能問趨勢</text>
    <text x="20" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D97706">💡 鎖定核心：拒絕毫無目的亂拉圖</text>
  </g>

  <!-- ==================== STEP 03 ==================== -->
  <g transform="translate(645, 140)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#DCFCE7" />
    <circle cx="24" cy="18" r="11" fill="#16A34A" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">3</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#15803D">STEP 03・問題分類</text>
    
    <text x="20" y="65" class="card-title">歸納五大問題類型</text>
    <text x="20" y="92" class="card-desc">• 📊 比較 (Comparison)：誰高誰低</text>
    <text x="20" y="114" class="card-desc">• 📈 趨勢 (Trend)：隨時間怎麼變</text>
    <text x="20" y="136" class="card-desc">• 🥧 組成 (Composition)：各占多少%</text>
    <text x="20" y="158" class="card-desc">• 📶 分布 (Distribution) / 🔗 關係 (Relation)</text>
  </g>

  <!-- ==================== STEP 04 ==================== -->
  <g transform="translate(65, 445)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#EEF2FF" />
    <circle cx="24" cy="18" r="11" fill="#4F46E5" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">4</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#4338CA">STEP 04・軸線與圖表</text>
    
    <text x="20" y="65" class="card-title">圖表 DNA 與坐標軸</text>
    <text x="20" y="92" class="card-desc">• X 軸放維度 (條件)、Y 軸放指標 (數值)</text>
    <text x="20" y="114" class="card-desc">• 長條圖數值基準線「必須從 0 起算」</text>
    <text x="20" y="136" class="card-desc">• 項目多或名稱長 ➔ 轉水平長條圖</text>
    <text x="20" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#4F46E5">💡 長條圖 vs 直方圖中英文不再混淆</text>
  </g>

  <!-- ==================== STEP 05 ==================== -->
  <g transform="translate(355, 445)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#9333EA" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#F3E8FF" />
    <circle cx="24" cy="18" r="11" fill="#9333EA" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">5</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#7E22CE">STEP 05・條件挑圖</text>
    
    <text x="20" y="65" class="card-title">依資料特徵二選一</text>
    <text x="20" y="92" class="card-desc">• 項目少於 7 個 ➔ 垂直長條圖</text>
    <text x="20" y="114" class="card-desc">• 項目多或名稱長 ➔ 水平長條圖</text>
    <text x="20" y="136" class="card-desc">• 結構比例 ➔ 首選 100% 堆疊長條圖</text>
    <text x="20" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#9333EA">💡 避開 3D、截斷 Y 軸與花俏地雷</text>
  </g>

  <!-- ==================== STEP 06 ==================== -->
  <g transform="translate(645, 445)" filter="url(#cardShadow)">
    <rect width="250" height="190" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#FFEDD5" />
    <circle cx="24" cy="18" r="11" fill="#EA580C" />
    <text x="24" y="22" text-anchor="middle" class="badge-num">6</text>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#C2410C">STEP 06・AI 協作</text>
    
    <text x="20" y="65" class="card-title">循序三階梯指揮 AI</text>
    <text x="20" y="92" class="card-desc">• 階梯一：交代業務情境與分析目標</text>
    <text x="20" y="114" class="card-desc">• 階梯二：指定明確圖表類型與 X/Y 軸</text>
    <text x="20" y="136" class="card-desc">• 階梯三：要求數值標註與高亮冠軍</text>
    <text x="20" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA580C">💡 AI 寫程式繪圖，人類掌控業務洞察</text>
  </g>

  <!-- 底部重要總結 Alert Banner -->
  <g transform="translate(65, 665)">
    <rect width="830" height="56" rx="8" fill="#1E293B" />
    <text x="32" y="34" font-family="-apple-system, sans-serif" font-size="18">💡</text>
    <text x="64" y="34" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
      黃金決策心法：不是先決定用什麼工具，而是「欄位角色限制提問 ➔ 問題類型縮小圖表範圍 ➔ 資料特徵拍板唯一圖表」！
    </text>
  </g>
</svg>
