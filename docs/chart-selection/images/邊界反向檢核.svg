<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-label="邊界反向檢核：畫出不能問的防呆紅線">
  <title>邊界反向檢核：畫出「不能問」的防呆紅線</title>
  <defs>
    <!-- 箭頭定義 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <!-- 陰影濾鏡 -->
    <filter id="card-shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .branch-line { stroke: #94A3B8; stroke-width: 2; fill: none; stroke-linecap: round; }
    .arrow-line { stroke: #DC2626; stroke-width: 2; fill: none; stroke-dasharray: 4 2; }
  </style>

  <!-- 背景底板 -->
  <rect x="1" y="1" width="858" height="448" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 頂部標題區 -->
  <rect x="30" y="22" width="130" height="24" rx="6" fill="#F1F5F9"/>
  <text x="95" y="38" class="font-base" font-size="12" fill="#475569" font-weight="bold" text-anchor="middle">邊界反向檢核</text>
  <text x="172" y="39" class="font-base" font-size="18" fill="#0F172A" font-weight="bold">畫出「不能問」的防呆紅線</text>
  <text x="30" y="66" class="font-base" font-size="13" fill="#64748B">提出問題後的反向可行性檢查，避免問出「這份資料根本無法回答」的無效問題</text>

  <!-- 分支曲線 (Root -> 條件卡片) -->
  <path d="M 165 240 C 195 240, 195 110, 225 110" class="branch-line"/>
  <path d="M 165 240 C 195 240, 195 175, 225 175" class="branch-line"/>
  <path d="M 165 240 L 225 240" class="branch-line"/>
  <path d="M 165 240 C 195 240, 195 305, 225 305" class="branch-line"/>
  <path d="M 165 240 C 195 240, 195 370, 225 370" class="branch-line"/>

  <!-- 左側核心檢核卡 (Root) -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="170" width="135" height="140" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="97.5" cy="212" r="22" fill="#1E293B"/>
    <text x="97.5" y="220" class="font-base" font-size="20" text-anchor="middle">🛡️</text>
    <text x="97.5" y="258" class="font-base" font-size="16" fill="#F8FAFC" font-weight="bold" text-anchor="middle">邊界檢核</text>
    <text x="97.5" y="282" class="font-base" font-size="12" fill="#94A3B8" text-anchor="middle">防呆紅線對照</text>
  </g>

  <!-- ==================== 第 1 組：時間欄位 ==================== -->
  <!-- 條件 -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="88" width="180" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="225" y="88" width="6" height="44" rx="3" fill="#64748B"/>
    <text x="318" y="115" class="font-base" font-size="14" fill="#1E293B" font-weight="bold" text-anchor="middle">缺乏【時間欄位】</text>
  </g>
  <!-- 指向箭頭 -->
  <line x1="405" y1="110" x2="435" y2="110" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 結果紅線 -->
  <g filter="url(#card-shadow)">
    <rect x="445" y="88" width="385" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="465" y="115" class="font-base" font-size="13.5" fill="#991B1B" font-weight="600">❌ 絕對不能問「趨勢如何、有沒有成長衰退」</text>
  </g>

  <!-- ==================== 第 2 組：類別欄位 ==================== -->
  <!-- 條件 -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="153" width="180" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="225" y="153" width="6" height="44" rx="3" fill="#64748B"/>
    <text x="318" y="180" class="font-base" font-size="14" fill="#1E293B" font-weight="bold" text-anchor="middle">缺乏【類別欄位】</text>
  </g>
  <!-- 指向箭頭 -->
  <line x1="405" y1="175" x2="435" y2="175" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 結果紅線 -->
  <g filter="url(#card-shadow)">
    <rect x="445" y="153" width="385" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="465" y="180" class="font-base" font-size="13.5" fill="#991B1B" font-weight="600">❌ 絕對不能問「哪一組表現好、誰高誰低」</text>
  </g>

  <!-- ==================== 第 3 組：單一數值 ==================== -->
  <!-- 條件 -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="218" width="180" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="225" y="218" width="6" height="44" rx="3" fill="#64748B"/>
    <text x="318" y="245" class="font-base" font-size="14" fill="#1E293B" font-weight="bold" text-anchor="middle">只有【單一數值】</text>
  </g>
  <!-- 指向箭頭 -->
  <line x1="405" y1="240" x2="435" y2="240" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 結果紅線 -->
  <g filter="url(#card-shadow)">
    <rect x="445" y="218" width="385" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="465" y="245" class="font-base" font-size="13.5" fill="#991B1B" font-weight="600">❌ 絕對不能問「兩者是否相關、是否被影響」</text>
  </g>

  <!-- ==================== 第 4 組：相關數據 ==================== -->
  <!-- 條件 -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="283" width="180" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="225" y="283" width="6" height="44" rx="3" fill="#64748B"/>
    <text x="318" y="310" class="font-base" font-size="14" fill="#1E293B" font-weight="bold" text-anchor="middle">只有【相關數據】</text>
  </g>
  <!-- 指向箭頭 -->
  <line x1="405" y1="305" x2="435" y2="305" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 結果紅線 -->
  <g filter="url(#card-shadow)">
    <rect x="445" y="283" width="385" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="465" y="310" class="font-base" font-size="13.5" fill="#991B1B" font-weight="600">❌ 絕對不能下「A 導致 B 發生」的因果結論</text>
  </g>

  <!-- ==================== 第 5 組：ID 標識碼 ==================== -->
  <!-- 條件 -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="348" width="180" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="225" y="348" width="6" height="44" rx="3" fill="#64748B"/>
    <text x="318" y="375" class="font-base" font-size="14" fill="#1E293B" font-weight="bold" text-anchor="middle">面對【ID 標識碼】</text>
  </g>
  <!-- 指向箭頭 -->
  <line x1="405" y1="370" x2="435" y2="370" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 結果紅線 -->
  <g filter="url(#card-shadow)">
    <rect x="445" y="348" width="385" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="465" y="375" class="font-base" font-size="13.5" fill="#991B1B" font-weight="600">❌ 絕對不能問「平均 ID 是多少」</text>
  </g>

  <!-- 底部微註解提示 -->
  <text x="30" y="426" class="font-base" font-size="12" fill="#94A3B8">💡 提問原則：數據庫沒有的維度不要憑空假設；若無 A/B 測試等對照組設計，切忌把相關性當成因果推論。</text>
</svg>
