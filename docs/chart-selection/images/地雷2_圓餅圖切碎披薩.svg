<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="260" viewBox="0 0 1088 260" role="img" aria-label="圓餅圖切成十幾塊碎披薩 (Too Many Pie Slices)">
  <title>圓餅圖切成十幾塊碎披薩 (Too Many Pie Slices)</title>
  <defs>
    <style>
      .row-tag { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 13px; font-weight: 800; }
      .box-title-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #166534; }
      .box-title-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #991B1B; }
      .box-desc-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #14532D; }
      .box-desc-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #7F1D1D; }
      .chart-label { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 11px; fill: #475569; font-weight: 600; }
      .chart-axis { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; fill: #94A3B8; }
      .stat-val { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 11px; font-weight: 800; }
    </style>
    <filter id="c-shadow" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- 單列小標籤 -->
  <rect x="0" y="0" width="1088" height="26" rx="5" fill="#F1F5F9" />
  <rect x="0" y="0" width="60" height="26" rx="5" fill="#0F172A" />
  <text x="30" y="17" class="row-tag" fill="#FFFFFF" text-anchor="middle">地雷 2</text>
  <text x="72" y="17" class="row-tag" fill="#1E293B">圓餅圖切成十幾塊碎披薩 (Too Many Pie Slices)</text>

  <!-- 左邊：✅ 正確做法 (寬 530, 高 210) -->
  <g transform="translate(0, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#F0FDF4" />
    <rect x="0" y="24" width="530" height="10" fill="#F0FDF4" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#DCFCE7" stroke-width="1" />
    <text x="14" y="22" class="box-title-c">✅ 改用排序水平長條圖・文字好讀易比較</text>
    <text x="14" y="52" class="box-desc-c">類別超過 4 個時改用長條圖由大到小排序，或將細碎小項收斂為「其他」。</text>
    <g transform="translate(130, 52)">
      
              <line x1="80" y1="20" x2="80" y2="135" stroke="#CBD5E1" stroke-width="1.2" />
              <text x="74" y="36" class="chart-label" text-anchor="end">智能手機</text>
              <rect x="80" y="25" width="135" height="14" rx="2" fill="#16A34A" />
              <text x="220" y="36" class="stat-val" fill="#15803D">45%</text>

              <text x="74" y="60" class="chart-label" text-anchor="end">平板電腦</text>
              <rect x="80" y="49" width="75" height="14" rx="2" fill="#22C55E" />
              <text x="160" y="60" class="stat-val" fill="#15803D">25%</text>

              <text x="74" y="84" class="chart-label" text-anchor="end">穿戴耳機</text>
              <rect x="80" y="73" width="45" height="14" rx="2" fill="#4ADE80" />
              <text x="130" y="84" class="stat-val" fill="#15803D">15%</text>

              <text x="74" y="108" class="chart-label" text-anchor="end">充電配件</text>
              <rect x="80" y="97" width="28" height="14" rx="2" fill="#86EFAC" />
              <text x="113" y="108" class="stat-val" fill="#15803D">9%</text>

              <text x="74" y="130" class="chart-label" text-anchor="end">其 他</text>
              <rect x="80" y="119" width="18" height="14" rx="2" fill="#CBD5E1" />
              <text x="103" y="130" class="stat-val" fill="#64748B">6%</text>
            
    </g>
  </g>

  <!-- 右邊：❌ 錯誤地雷 (寬 530, 高 210) -->
  <g transform="translate(558, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#FEF2F2" />
    <rect x="0" y="24" width="530" height="10" fill="#FEF2F2" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#FEE2E2" stroke-width="1" />
    <text x="14" y="22" class="box-title-w">❌ 切成 12 等分・標籤文字重疊且面積難辨</text>
    <text x="14" y="52" class="box-desc-w">人類視網膜對角度極不敏感，細碎扇形擠在一起根本看不出誰大誰小。</text>
    <g transform="translate(130, 52)">
      
              <g transform="translate(130, 75)">
                <path d="M 0 0 L 0 -50 A 50 50 0 0 1 43 -25 Z" fill="#EF4444" />
                <path d="M 0 0 L 43 -25 A 50 50 0 0 1 50 0 Z" fill="#F87171" />
                <path d="M 0 0 L 50 0 A 50 50 0 0 1 43 25 Z" fill="#FCA5A5" />
                <path d="M 0 0 L 43 25 A 50 50 0 0 1 25 43 Z" fill="#FB923C" />
                <path d="M 0 0 L 25 43 A 50 50 0 0 1 0 50 Z" fill="#FBBF24" />
                <path d="M 0 0 L 0 50 A 50 50 0 0 1 -25 43 Z" fill="#A3E635" />
                <path d="M 0 0 L -25 43 A 50 50 0 0 1 -43 25 Z" fill="#34D399" />
                <path d="M 0 0 L -43 25 A 50 50 0 0 1 -50 0 Z" fill="#38BDF8" />
                <path d="M 0 0 L -50 0 A 50 50 0 0 1 -43 -25 Z" fill="#818CF8" />
                <path d="M 0 0 L -43 -25 A 50 50 0 0 1 -25 -43 Z" fill="#C084FC" />
                <path d="M 0 0 L -25 -43 A 50 50 0 0 1 0 -50 Z" fill="#F472B6" />
                <circle cx="0" cy="0" r="1.5" fill="#FFF" />
              </g>
              <text x="130" y="142" font-size="9" fill="#B91C1C" font-weight="700" text-anchor="middle">碎片繁雜・標籤擁擠碰撞</text>
            
    </g>
  </g>
</svg>
