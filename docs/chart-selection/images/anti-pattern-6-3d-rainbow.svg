<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="260" viewBox="0 0 1088 260" role="img" aria-label="花俏的 3D 效果與多餘色彩 (Distracting 3D &amp; Rainbow)">
  <title>花俏的 3D 效果與多餘色彩 (Distracting 3D &amp; Rainbow)</title>
  <defs>
    <style>
      .row-tag { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 13px; font-weight: 800; }
      .box-title-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #166534; }
      .box-title-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 14px; font-weight: 800; fill: #991B1B; }
      .box-desc-c { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #14532D; }
      .box-desc-w { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 12px; font-weight: 500; fill: #7F1D1D; }
      .chart-label { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 11px; fill: #475569; font-weight: 600; }
      .chart-axis { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; fill: #94A3B8; }
      .stat-val { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 11px; font-weight: 800; }
    </style>
    <filter id="c-shadow" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- 單列小標籤 -->
  <rect x="0" y="0" width="1088" height="26" rx="5" fill="#F1F5F9" />
  <rect x="0" y="0" width="60" height="26" rx="5" fill="#0F172A" />
  <text x="30" y="17" class="row-tag" fill="#FFFFFF" text-anchor="middle">地雷 6</text>
  <text x="72" y="17" class="row-tag" fill="#1E293B">花俏的 3D 效果與多餘色彩 (Distracting 3D &amp; Rainbow)</text>

  <!-- 左邊：✅ 正確做法 (寬 530, 高 210) -->
  <g transform="translate(0, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#F0FDF4" />
    <rect x="0" y="24" width="530" height="10" fill="#F0FDF4" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#DCFCE7" stroke-width="1" />
    <text x="14" y="22" class="box-title-c">✅ 平面 2D 簡潔・灰色基底 + 單一強調色聚焦</text>
    <text x="14" y="52" class="box-desc-c">背景資料用乾淨灰色，僅突顯核心主角（門市B），視線一秒鎖定關鍵資訊。</text>
    <g transform="translate(130, 52)">
      
              <line x1="30" y1="120" x2="230" y2="120" stroke="#CBD5E1" stroke-width="1.2" />
              <rect x="50" y="55" width="38" height="65" rx="3" fill="#CBD5E1" />
              <text x="69" y="134" class="chart-label" text-anchor="middle">門市 A</text>

              <rect x="110" y="30" width="38" height="90" rx="3" fill="#16A34A" />
              <text x="129" y="22" class="stat-val" fill="#15803D" text-anchor="middle">焦點冠軍!</text>
              <text x="129" y="134" class="chart-label" font-weight="800" text-anchor="middle">門市 B</text>

              <rect x="170" y="65" width="38" height="55" rx="3" fill="#CBD5E1" />
              <text x="189" y="134" class="chart-label" text-anchor="middle">門市 C</text>
            
    </g>
  </g>

  <!-- 右邊：❌ 錯誤地雷 (寬 530, 高 210) -->
  <g transform="translate(558, 36)">
    <rect x="0" y="0" width="530" height="214" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#c-shadow)" />
    <rect x="0" y="0" width="530" height="34" rx="10" fill="#FEF2F2" />
    <rect x="0" y="24" width="530" height="10" fill="#FEF2F2" />
    <line x1="0" y1="34" x2="530" y2="34" stroke="#FEE2E2" stroke-width="1" />
    <text x="14" y="22" class="box-title-w">❌ 傾斜 3D 透視偏差・彩虹雜色干擾視線</text>
    <text x="14" y="52" class="box-desc-w">3D 透視造成後方高度被視覺壓縮，加上七彩色塊分散注意力，毫無閱讀焦點。</text>
    <g transform="translate(130, 52)">
      
              <!-- 3D 柱狀示意 -->
              <g transform="translate(30, 20)">
                <!-- 3D 柱 1 -->
                <path d="M 30 90 L 50 80 L 70 80 L 50 90 Z" fill="#FCA5A5" />
                <path d="M 50 90 L 70 80 L 70 110 L 50 120 Z" fill="#EF4444" />
                <path d="M 30 90 L 50 90 L 50 120 L 30 120 Z" fill="#F87171" />
                <!-- 3D 柱 2 -->
                <path d="M 80 50 L 100 40 L 120 40 L 100 50 Z" fill="#FDE047" />
                <path d="M 100 50 L 120 40 L 120 110 L 100 120 Z" fill="#EAB308" />
                <path d="M 80 50 L 100 50 L 100 120 L 80 120 Z" fill="#FACC15" />
                <!-- 3D 柱 3 -->
                <path d="M 130 70 L 150 60 L 170 60 L 150 70 Z" fill="#86EFAC" />
                <path d="M 150 70 L 170 60 L 170 110 L 150 120 Z" fill="#22C55E" />
                <path d="M 130 70 L 150 70 L 150 120 L 130 120 Z" fill="#4ADE80" />
              </g>
              <text x="130" y="142" font-size="9" fill="#DC2626" font-weight="800" text-anchor="middle">3D 透視扭曲 + 彩虹雜色混亂</text>
            
    </g>
  </g>
</svg>
