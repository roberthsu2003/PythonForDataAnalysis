<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五大問題類型與圖表動態視覺化 | 看懂資料與選對圖表</title>
  <meta name="description" content="互動式動畫展示五大分析問題（比較、組成、分布、關係、趨勢）所對應的真實圖表樣貌，點擊按鈕即時觀看圖表生長動畫。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --comp-color: #2563eb;
      --compst-color: #ea580c;
      --dist-color: #7c3aed;
      --rel-color: #059669;
      --trend-color: #dc2626;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.08), 0 10px 10px -5px rgba(0,0,0,0.03);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--slate-800);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Hero */
    .hero {
      max-width: 1000px;
      margin: 36px auto 20px;
      padding: 0 24px;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      color: #2563eb;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--slate-900);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--slate-600);
      max-width: 720px;
      margin: 0 auto;
    }

    /* 控制列：五大問題分類按鈕 */
    .type-switcher {
      max-width: 1100px;
      margin: 20px auto 28px;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .type-btn {
      background: #FFFFFF;
      border: 2px solid var(--slate-200);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--slate-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.22s ease;
      box-shadow: var(--shadow-sm);
    }
    .type-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .type-btn.active[data-type="comp"] {
      background: var(--comp-color); border-color: var(--comp-color); color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }
    .type-btn.active[data-type="compst"] {
      background: var(--compst-color); border-color: var(--compst-color); color: #fff;
      box-shadow: 0 4px 14px rgba(234,88,12,0.35);
    }
    .type-btn.active[data-type="dist"] {
      background: var(--dist-color); border-color: var(--dist-color); color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .type-btn.active[data-type="rel"] {
      background: var(--rel-color); border-color: var(--rel-color); color: #fff;
      box-shadow: 0 4px 14px rgba(5,150,105,0.35);
    }
    .type-btn.active[data-type="trend"] {
      background: var(--trend-color); border-color: var(--trend-color); color: #fff;
      box-shadow: 0 4px 14px rgba(220,38,38,0.35);
    }

    /* 主展示舞台 */
    .stage {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .stage-card {
      background: var(--card-bg);
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-xl);
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .stage-card {
        grid-template-columns: 1fr;
        padding: 24px;
      }
    }

    /* 左側：文字解說區 */
    .text-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .type-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .type-tag {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      color: #fff;
    }
    .type-en-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    /* 溝通核心卡片 */
    .core-box {
      background: #F8FAFC;
      border-left: 5px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .core-box .label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .core-box .content {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--slate-900);
      line-height: 1.4;
    }

    /* 經典問法對話氣泡清單 */
    .questions-box {
      background: #FFFFFF;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }
    .questions-box .label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--slate-600);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: var(--slate-700);
      font-weight: 600;
    }
    .q-item:last-child {
      margin-bottom: 0;
    }
    .q-item span.bubble-icon {
      color: var(--primary);
    }

    /* 左下角：可點擊的圖表按鈕清單 */
    .sub-charts-section {
      background: #F8FAFC;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .sub-charts-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--slate-700);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sub-charts-hint {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 600;
    }
    .sub-charts-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sub-chart-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--slate-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .sub-chart-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .sub-chart-btn.active {
      background: #EFF6FF;
      border-color: #2563EB;
      color: #1E40AF;
      box-shadow: 0 2px 6px rgba(37,99,235,0.2);
    }
    .sub-chart-btn.active::before {
      content: '✔';
      font-size: 0.75rem;
      color: #2563EB;
    }

    /* 右側：動態圖表畫布 */
    .canvas-column {
      background: #F8FAFC;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--slate-200);
    }
    .canvas-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--slate-900);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .replay-btn {
      background: #FFFFFF;
      border: 1px solid var(--slate-300);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--slate-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .replay-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .svg-wrapper {
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .svg-wrapper svg {
      width: 100%;
      height: 100%;
    }

    /* 下方說明與避坑 */
    .chart-info-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }
    .chart-info-item {
      display: flex;
      gap: 8px;
      line-height: 1.5;
    }
    .chart-info-item strong {
      color: var(--slate-900);
      white-space: nowrap;
    }
    .chart-code-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      background: var(--slate-100);
      padding: 3px 8px;
      border-radius: 4px;
      color: #0F172A;
      display: inline-block;
      margin-top: 4px;
    }

    /* 頁尾 */
    footer {
      max-width: 1100px;
      margin: 48px auto 0;
      padding: 24px;
      border-top: 1px solid var(--slate-200);
      text-align: center;
      color: var(--slate-600);
      font-size: 0.9rem;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="./js/nav.js"></script>
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-badge">🎬 互動式動態演示</div>
    <h1>五大問題類型與圖表動態對照</h1>
    <p>看懂文字，秒懂圖表！點選上方五大問題類型，再點擊左下角圖表按鈕，親眼看見圖表如何動態生長出來！</p>
  </section>

  <!-- 五大按鈕選單 -->
  <div class="type-switcher" id="typeSwitcher">
    <button class="type-btn active" data-type="comp">
      <span>📊</span> 1. 比較 (Comparison)
    </button>
    <button class="type-btn" data-type="compst">
      <span>🍰</span> 2. 組成 (Composition)
    </button>
    <button class="type-btn" data-type="dist">
      <span>📦</span> 3. 分布 (Distribution)
    </button>
    <button class="type-btn" data-type="rel">
      <span>🔗</span> 4. 關係 (Relationship)
    </button>
    <button class="type-btn" data-type="trend">
      <span>📈</span> 5. 趨勢 (Trend)
    </button>
  </div>

  <!-- 主展示舞台 -->
  <main class="stage">
    <div class="stage-card">

      <!-- 左側文字解說 -->
      <div class="text-column">
        <div class="type-header">
          <span class="type-tag" id="typeTag" style="background: var(--comp-color);">比較問題</span>
          <span class="type-en-title" id="typeEnTitle">Comparison</span>
        </div>

        <!-- 溝通核心（最上方） -->
        <div class="core-box" id="coreBox" style="border-left-color: var(--comp-color);">
          <div class="label" id="coreLabel" style="color: var(--comp-color);">
            <span>🎯</span> 溝通核心
          </div>
          <div class="content" id="coreContent">
            突顯「高低差距」與「相對排名」。
          </div>
        </div>

        <!-- 經典問法 -->
        <div class="questions-box">
          <div class="label">
            <span>🗣️</span> 經典問法（老闆 / 主管會這樣問）：
          </div>
          <div id="questionsList"></div>
        </div>

        <!-- 左下角：可點擊的圖表按鈕清單 -->
        <div class="sub-charts-section">
          <div class="sub-charts-title">
            <span>🖼️ 點擊下方圖表，觀看動態動畫：</span>
            <span class="sub-charts-hint">點選立即切換 ➔</span>
          </div>
          <div class="sub-charts-grid" id="subChartBtns">
            <!-- 由 JS 動態注入可點選按鈕 -->
          </div>
        </div>
      </div>

      <!-- 右側動態圖表畫布 -->
      <div class="canvas-column">
        <div class="canvas-header">
          <div class="canvas-title">
            <span>🎬</span> <span id="chartCaption">圖表動畫演示</span>
          </div>
          <button class="replay-btn" id="replayBtn" title="重新播放動畫">
            <span>🔄</span> 重新播放
          </button>
        </div>

        <div class="svg-wrapper" id="svgStage">
          <!-- 由 JS 繪製並觸發 SVG SMIL 動畫 -->
        </div>

        <!-- 圖表詳細說明與避坑 -->
        <div class="chart-info-box">
          <div class="chart-info-item">
            <strong>💡 適用時機：</strong>
            <span id="chartWhen">...</span>
          </div>
          <div class="chart-info-item">
            <strong style="color: #dc2626;">⚠️ 避坑提醒：</strong>
            <span id="chartWarn">...</span>
          </div>
          <div class="chart-info-item">
            <strong>💻 程式語法：</strong>
            <div><span class="chart-code-hint" id="chartCode">df.plot()</span></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- 頁尾 -->
  <footer>
    <p>返回專題文件：<a href="https://github.com/roberthsu2003/PythonForDataAnalysis/tree/master/%E7%9C%8B%E6%87%82%E8%B3%87%E6%96%99%E8%88%87%E9%81%B8%E5%B0%8D%E5%9C%96%E8%A1%A8/%E6%95%B8%E6%93%9A%E9%81%B8%E5%9C%96%E6%80%9D%E8%80%83%E8%A6%8F%E5%89%87" target="_blank">📖 數據選圖思考規則完整指引</a> ｜ <a href="./field-combinations.html">⚡ 欄位組合速查工具</a></p>
  </footer>

  <script>
    // 完整題庫與所有對應的子圖表動畫庫
    const fullModel = {
      comp: {
        tagName: "比較問題",
        enName: "Comparison",
        themeColor: "#2563eb",
        core: "突顯「高低差距」與「相對排名」。",
        questions: [
          "「哪一個品項／部門賣得最好？」",
          "「北中南各區的業績排名與差距如何？」",
          "「今年各部門的預算達成率誰最高？」"
        ],
        subCharts: [
          {
            name: "水平長條圖 (首選)",
            caption: "水平長條圖：由長到短排序，標籤好讀不折行",
            when: "類別大於 7 個、或標籤文字較長時的首選；人類肉眼對長度比對最敏感。",
            warn: "長條圖基準線（X 軸）必須從 0 起跳！依數值由大到小排序。",
            code: "df.sort_values('金額').plot(x='部門', y='金額', kind='barh')",
            svg: () => `
              <svg viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
                <line x1="80" y1="20" x2="80" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
                <line x1="80" y1="200" x2="390" y2="200" stroke="#CBD5E1" stroke-width="1"/>
                
                <text x="70" y="52" font-size="12" fill="#334155" text-anchor="end" font-weight="bold">研發部</text>
                <rect x="80" y="36" width="0" height="24" rx="4" fill="#2563EB">
                  <animate attributeName="width" from="0" to="260" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="350" y="52" font-size="11" fill="#2563EB" font-weight="bold">450 萬</text>

                <text x="70" y="95" font-size="12" fill="#334155" text-anchor="end" font-weight="bold">業務部</text>
                <rect x="80" y="79" width="0" height="24" rx="4" fill="#3B82F6">
                  <animate attributeName="width" from="0" to="190" dur="0.8s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="280" y="95" font-size="11" fill="#3B82F6" font-weight="bold">320 萬</text>

                <text x="70" y="138" font-size="12" fill="#334155" text-anchor="end" font-weight="bold">行銷部</text>
                <rect x="80" y="122" width="0" height="24" rx="4" fill="#60A5FA">
                  <animate attributeName="width" from="0" to="120" dur="0.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="210" y="138" font-size="11" fill="#60A5FA" font-weight="bold">190 萬</text>

                <text x="70" y="181" font-size="12" fill="#334155" text-anchor="end" font-weight="bold">人資部</text>
                <rect x="80" y="165" width="0" height="24" rx="4" fill="#93C5FD">
                  <animate attributeName="width" from="0" to="65" dur="0.8s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="155" y="181" font-size="11" fill="#93C5FD" font-weight="bold">95 萬</text>
              </svg>
            `
          },
          {
            name: "垂直長條圖",
            caption: "垂直長條圖：類別少於 7 個且名稱短時的最佳選擇",
            when: "項目少且文字精簡時，垂直長條符合一般閱讀習慣。",
            warn: "垂直長條圖 Y 軸必須從 0 開始，避免視覺放大切成顯著假象。",
            code: "df.plot(x='部門', y='金額', kind='bar')",
            svg: () => `
              <svg viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="20" x2="50" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
                <line x1="50" y1="190" x2="380" y2="190" stroke="#94A3B8" stroke-width="1.5"/>

                <!-- 4 根垂直長條由下拔高 -->
                <rect x="75" y="190" width="45" height="0" rx="3" fill="#2563EB">
                  <animate attributeName="height" from="0" to="140" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                  <animate attributeName="y" from="190" to="50" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="97" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">研發</text>

                <rect x="150" y="190" width="45" height="0" rx="3" fill="#3B82F6">
                  <animate attributeName="height" from="0" to="105" dur="0.8s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                  <animate attributeName="y" from="190" to="85" dur="0.8s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
                </rect>
                <text x="172" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">業務</text>

                <rect x="225" y="190" width="45" height="0" rx="3" fill="#60A5FA">
                  <animate attributeName="height" from="0" to="70" dur="0.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>

                <line x1="70" y1="175" x2="360" y2="40" stroke="#10B981" stroke-width="2" stroke-dasharray="5 3"/>
                <text x="350" y="210" font-size="11" fill="#64748B" font-weight="bold">X 軸：拜訪次數 →</text>
                <text x="60" y="25" font-size="11" fill="#64748B" font-weight="bold">↑ Y 軸：成交額</text>
              </svg>
            `
          },
          {
            name: "氣泡圖 (3 個變數)",
            caption: "氣泡圖：X 軸、Y 軸加上氣泡面積大小（第 3 個指標）",
            when: "除了兩個連續變數外，還想同時看規模大小（如公司人口、總預算）。",
            warn: "氣泡必須按「面積」而非「半徑」縮放，避免視覺誇大 4 倍。",
            code: "plt.scatter(x, y, s=df['利潤']*10, alpha=0.5)",
            svg: () => `
              <svg viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="190" x2="380" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
                <line x1="50" y1="20" x2="50" y2="190" stroke="#CBD5E1" stroke-width="1"/>

                <circle cx="90" cy="140" r="0" fill="#059669" opacity="0.6">
                  <animate attributeName="r" from="0" to="12" dur="0.5s" begin="0.1s" fill="freeze"/>
                </circle>
                <circle cx="160" cy="110" r="0" fill="#059669" opacity="0.6">
                  <animate attributeName="r" from="0" to="24" dur="0.5s" begin="0.25s" fill="freeze"/>
                </circle>
                <circle cx="250" cy="80" r="0" fill="#059669" opacity="0.6">
                  <animate attributeName="r" from="0" to="35" dur="0.5s" begin="0.4s" fill="freeze"/>
                </circle>
                <circle cx="330" cy="50" r="0" fill="#059669" opacity="0.6">
                  <animate attributeName="r" from="0" to="16" dur="0.5s" begin="0.55s" fill="freeze"/>
                </circle>

                <text x="210" y="210" font-size="11" fill="#059669" font-weight="bold" text-anchor="middle">圓形大小代表第 3 個數值指標（如利潤規模）</text>
              </svg>
            `
          }
        ]
      },
      trend: {
        tagName: "趨勢問題",
        enName: "Trend",
        themeColor: "#dc2626",
        core: "觀察「數據隨時間序列演進的變化走勢、週期與轉折點」。",
        questions: [
          "「過去 12 個月營收是在成長還是下滑？」",
          "「網站訪問流量在週末是否有週期性下跌？」",
          "「新產品自上市以來，每日活躍用戶的走勢如何？」"
        ],
        subCharts: [
          {
            name: "折線圖 (首選)",
            caption: "折線圖：時間由左至右，觀察斜率與波段轉折",
            when: "連續時間點較多（> 5 個時間點，例如每月、每日走勢）。",
            warn: "X 軸必須是真實時間型態且嚴格遞增；非時間類別嚴禁連線！",
            code: "df.plot(x='月份', y='營收', kind='line', marker='o')",
            svg: () => `
              <svg viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="190" x2="380" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
                <line x1="50" y1="20" x2="50" y2="190" stroke="#CBD5E1" stroke-width="1"/>

                <!-- 折線動畫 -->
                <polyline points="70,160 120,170 170,130 220,90 270,110 320,50 370,35"
                  fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="600" stroke-dashoffset="600">
                  <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.2s" begin="0.1s" fill="freeze"/>
                </polyline>

                <!-- 節點圓點 -->
                <circle cx="70" cy="160" r="4.5" fill="#DC2626"/><text x="70" y="210" font-size="10" fill="#64748B" text-anchor="middle">1月</text>
                <circle cx="120" cy="170" r="4.5" fill="#DC2626"/><text x="120" y="210" font-size="10" fill="#64748B" text-anchor="middle">2月</text>
                <circle cx="170" cy="130" r="4.5" fill="#DC2626"/><text x="170" y="210" font-size="10" fill="#64748B" text-anchor="middle">3月</text>
                <circle cx="220" cy="90" r="4.5" fill="#DC2626"/><text x="220" y="210" font-size="10" fill="#64748B" text-anchor="middle">4月</text>
                <circle cx="270" cy="110" r="4.5" fill="#DC2626"/><text x="270" y="210" font-size="10" fill="#64748B" text-anchor="middle">5月</text>
                <circle cx="320" cy="50" r="4.5" fill="#DC2626"/><text x="320" y="210" font-size="10" fill="#64748B" text-anchor="middle">6月</text>
                <circle cx="370" cy="35" r="4.5" fill="#DC2626"/><text x="370" y="210" font-size="10" fill="#64748B" text-anchor="middle">7月</text>
              </svg>
            `
          },
          {
            name: "時間長條圖 (少時間點)",
            caption: "時間長條圖：只有少數季度時，長條圖比折線更穩重",
            when: "只有 3~4 個時間點（如 Q1, Q2, Q3, Q4 或 2022~2024 年報）。",
            warn: "時間點太少時畫折線圖會只有短短兩截，長條圖更能傳達獨立量體感。",
            code: "df.plot(x='季度', y='營收', kind='bar')",
            svg: () => `
              <svg viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="190" x2="380" y2="190" stroke="#94A3B8" stroke-width="1.5"/>

                <rect x="75" y="190" width="48" height="0" rx="3" fill="#DC2626">
                  <animate attributeName="height" from="0" to="90" dur="0.7s" begin="0.1s" fill="freeze"/>
                  <animate attributeName="y" from="190" to="100" dur="0.7s" begin="0.1s" fill="freeze"/>
                </rect>
                <text x="99" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">Q1</text>

                <rect x="150" y="190" width="48" height="0" rx="3" fill="#DC2626">
                  <animate attributeName="height" from="0" to="120" dur="0.7s" begin="0.25s" fill="freeze"/>
                  <animate attributeName="y" from="190" to="70" dur="0.7s" begin="0.25s" fill="freeze"/>
                </rect>
                <text x="174" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">Q2</text>

                <rect x="225" y="190" width="48" height="0" rx="3" fill="#DC2626">
                  <animate attributeName="height" from="0" to="80" dur="0.7s" begin="0.4s" fill="freeze"/>
                  <animate attributeName="y" from="190" to="110" dur="0.7s" begin="0.4s" fill="freeze"/>
                </rect>
                <text x="249" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">Q3</text>

                <rect x="300" y="190" width="48" height="0" rx="3" fill="#DC2626">
                  <animate attributeName="height" from="0" to="150" dur="0.7s" begin="0.55s" fill="freeze"/>
                  <animate attributeName="y" from="190" to="40" dur="0.7s" begin="0.55s" fill="freeze"/>
                </rect>
                <text x="324" y="210" font-size="11" fill="#334155" text-anchor="middle" font-weight="bold">Q4</text>
              </svg>
            `
          }
        ]
      }
    };

    let currentMainType = 'comp';
    let currentSubChartIndex = 0;

    // 渲染五大問題類型
    function selectMainType(typeKey) {
      currentMainType = typeKey;
      currentSubChartIndex = 0;
      const data = fullModel[typeKey];

      // 更新上方分類按鈕
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === typeKey);
      });

      // 更新標題與溝通核心
      const tag = document.getElementById('typeTag');
      tag.innerText = data.tagName;
      tag.style.background = data.themeColor;
      document.getElementById('typeEnTitle').innerText = data.enName;

      const coreBox = document.getElementById('coreBox');
      coreBox.style.borderLeftColor = data.themeColor;
      document.getElementById('coreLabel').style.color = data.themeColor;
      document.getElementById('coreContent').innerText = data.core;

      // 更新經典問法
      const qList = document.getElementById('questionsList');
      qList.innerHTML = data.questions.map(q => `
        <div class="q-item">
          <span class="bubble-icon">💬</span>
          <span>${q}</span>
        </div>
      `).join('');

      // 動態生成左下角子圖表按鈕！
      const btnContainer = document.getElementById('subChartBtns');
      btnContainer.innerHTML = '';
      data.subCharts.forEach((chart, idx) => {
        const btn = document.createElement('button');
        btn.className = `sub-chart-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerText = chart.name;
        btn.onclick = () => selectSubChart(idx);
        btnContainer.appendChild(btn);
      });

      // 載入第一個子圖表
      selectSubChart(0);
    }

    // 渲染具體子圖表與動畫
    function selectSubChart(subIdx) {
      currentSubChartIndex = subIdx;
      const data = fullModel[currentMainType];
      const chart = data.subCharts[subIdx];

      // 更新左下角按鈕狀態
      document.querySelectorAll('.sub-chart-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === subIdx);
      });

      // 更新右側說明文字
      document.getElementById('chartCaption').innerText = chart.caption;
      document.getElementById('chartWhen').innerText = chart.when;
      document.getElementById('chartWarn').innerText = chart.warn;
      document.getElementById('chartCode').innerText = chart.code;

      // 播放 SVG SMIL 動畫
      playCurrentSVG();
    }

    function playCurrentSVG() {
      const chart = fullModel[currentMainType].subCharts[currentSubChartIndex];
      const stage = document.getElementById('svgStage');
      stage.innerHTML = chart.svg();
    }

    // 頂部大類切換事件
    document.getElementById('typeSwitcher').addEventListener('click', (e) => {
      const btn = e.target.closest('.type-btn');
      if (btn) {
        selectMainType(btn.dataset.type);
      }
    });

    // 重新播放按鈕
    document.getElementById('replayBtn').addEventListener('click', () => {
      playCurrentSVG();
    });

    // 頁面初次載入
    selectMainType('comp');
  </script>
</body>
</html>
